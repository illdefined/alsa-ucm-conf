Include.pcm_split.File "/common/pcm/split.conf"

# This profile only exposes the most common channel configurations to limit
# combinatorial complexity:
#
#  - Analog line outputs in stereo as well as 4.0 and 5.1 surround,
#  - analog microphone and instrument inputs in mono only, and
#  - all other outputs in stereo.

Macro [
	{
		SplitPCM {
			Name "ucx2_stereo_out"
			Direction Playback
			Channels 2
			HWChannels 20
			HWChannelPos0 FL
			HWChannelPos1 FR
		}
	}
	{
		SplitPCM {
			Name "ucx2_surround40_out"
			Direction Playback
			Channels 4
			HWChannels 20
			HWChannelPos0 FL
			HWChannelPos1 FR
			HWChannelPos2 RL
			HWChannelPos3 RR
		}
	}
	{
		SplitPCM {
			Name "ucx2_surround51_out"
			Direction Playback
			Channels 6
			HWChannels 20
			HWChannelPos0 FL
			HWChannelPos1 FR
			HWChannelPos2 RL
			HWChannelPos3 RR
			HWChannelPos4 FC
			HWChannelPos5 LFE
		}
	}
	{
		SplitPCM {
			Name "ucx2_multichannel_out"
			Direction Playback
			Channels 8
			HWChannels 20
			HWChannelPos0 AUX0
			HWChannelPos1 AUX1
			HWChannelPos2 AUX2
			HWChannelPos3 AUX3
			HWChannelPos4 AUX4
			HWChannelPos5 AUX5
			HWChannelPos6 AUX6
			HWChannelPos7 AUX7
		}
	}
	{
		SplitPCM {
			Name "ucx2_mono_in"
			Direction Capture
			Channels 1
			HWChannels 20
			HWChannelPos0 MONO
		}
	}
	{
		SplitPCM {
			Name "ucx2_stereo_in"
			Direction Capture
			Channels 2
			HWChannels 20
			HWChannelPos0 FL
			HWChannelPos1 FR
		}
	}
	{
		SplitPCM {
			Name "ucx2_multichannel_in"
			Direction Capture
			Channels 8
			HWChannels 20
			HWChannelPos0 AUX0
			HWChannelPos1 AUX1
			HWChannelPos2 AUX2
			HWChannelPos3 AUX3
			HWChannelPos4 AUX4
			HWChannelPos5 AUX5
			HWChannelPos6 AUX6
			HWChannelPos7 AUX7
		}
	}
]

# Analog outputs

SectionDevice."Headphones" {
	Comment "Headphones"

	Value {
		PlackbackPriority 255
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "ucx2_stereo_out"
		Channel0 6
		Channel1 7
	}
}

SectionDevice."Line 1" {
	Comment "Line Output 1+2"

	Value {
		PlackbackPriority 192
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "ucx2_stereo_out"
		Channel0 0
		Channel1 1
	}
}

SectionDevice."Line 2" {
	Comment "Line Output 3+4"

	Value {
		PlackbackPriority 191
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "ucx2_stereo_out"
		Channel0 2
		Channel1 3
	}
}

SectionDevice."Line 3" {
	Comment "Line Output 5+6"

	Value {
		PlackbackPriority 190
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "ucx2_stereo_out"
		Channel0 4
		Channel1 5
	}
}

# Analog outputs in 4.0 surround configuration

SectionDevice."Line 4" {
	Comment "Line Output 1-4 (4.0 Surround)"

	ConflictingDevice [
		"Line 1"
		"Line 2"
	]

	Value {
		PlackbackPriority 160
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "ucx2_surround40_out"
		Channel0 0
		Channel1 1
		Channel2 2
		Channel3 3
	}
}

# Analog outputs in 5.1 surround configuration

SectionDevice."Line 5" {
	Comment "Line Output 1-6 (5.1 Surround)"

	Value {
		PlackbackPriority 144
	}

	ConflictingDevice [
		"Line 1"
		"Line 2"
		"Line 3"
		"Line 4"
	]

	Macro.pcm_split.SplitPCMDevice {
		Name "ucx2_surround51_out"
		Channel0 0
		Channel1 1
		Channel2 2
		Channel3 3
		Channel4 4
		Channel5 5
	}
}

