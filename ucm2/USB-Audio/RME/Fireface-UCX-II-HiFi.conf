Include.pcm_split.File "/common/pcm/split.conf"

Macro [
	{
		SplitPCM {
			Name "ucx2_stereo_out"
			Direction Playback
			Channels 2
			HWChannels 20
			HWChannelPos0 FL
			HWChannelPos1 FR
		}
	}
	{
		SplitPCM {
			Name "ucx2_surround40_out"
			Direction Playback
			Channels 4
			HWChannels 20
			HWChannelPos0 FL
			HWChannelPos1 FR
			HWChannelPos2 RL
			HWChannelPos3 RR
		}
	}
	{
		SplitPCM {
			Name "ucx2_surround51_out"
			Direction Playback
			Channels 6
			HWChannels 20
			HWChannelPos0 FL
			HWChannelPos1 FR
			HWChannelPos2 RL
			HWChannelPos3 RR
			HWChannelPos4 FC
			HWChannelPos5 LFE
		}
	}
	{
		SplitPCM {
			Name "ucx2_mono_in"
			Direction Capture
			Channels 1
			HWChannels 20
			HWChannelPos0 MONO
		}
	}
	{
		SplitPCM {
			Name "ucx2_stereo_in"
			Direction Capture
			Channels 2
			HWChannels 20
			HWChannelPos0 FL
			HWChannelPos1 FR
		}
	}
]

# Back: TRS 1/4" line outputs 1 to 6

SectionDevice."Line1" {
	Comment "Line Output 1+2"

	Value {
		PlackbackPriority 500
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "ucx2_stereo_out"
		Direction Playback
		HWChannels 20
		Channels 2
		Channel0 0
		Channel1 1
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

SectionDevice."Line2" {
	Comment "Line Output 3+4"

	Value {
		PlackbackPriority 490
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "ucx2_stereo_out"
		Direction Playback
		HWChannels 20
		Channels 2
		Channel0 2
		Channel1 3
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

SectionDevice."Line3" {
	Comment "Line Output 5+6"

	Value {
		PlackbackPriority 480
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "ucx2_stereo_out"
		Direction Playback
		HWChannels 20
		Channels 2
		Channel0 4
		Channel1 5
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

# Line outputs in 4.0 surround configuration

SectionDevice."Line4" {
	Comment "Line Output 1+2+3+4"

	ConflictingDevice [
		"Line1"
		"Line2"
	]

	Value {
		PlackbackPriority 300
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "ucx2_surround40_out"
		Direction Playback
		HWChannels 20
		Channels 4
		Channel0 0
		Channel1 1
		Channel2 2
		Channel3 3
		ChannelPos0 FL
		ChannelPos1 FR
		ChannelPos2 RL
		ChannelPos3 RR
	}
}

# Line outputs in 5.1 surround configuration

SectionDevice."Line5" {
	Comment "Line Output 1+2+3+4+5+6"

	Value {
		PlackbackPriority 290
	}
	ConflictingDevice [
		"Line1"
		"Line2"
		"Line3"
		"Line4"
	]

	Macro.pcm_split.SplitPCMDevice {
		Name "ucx2_surround51_out"
		Direction Playback
		HWChannels 20
		Channels 6
		Channel0 0
		Channel1 1
		Channel2 2
		Channel3 3
		Channel4 4
		Channel5 5
		ChannelPos0 FL
		ChannelPos1 FR
		ChannelPos2 RL
		ChannelPos3 RR
		ChannelPos4 FC
		ChannelPos5 LFE
	}
}

